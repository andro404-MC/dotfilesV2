# BACKGROUND
background {
    monitor =
    path = ~/Pictures/Wallpapers/pleiades-watchtower-2-baked.png
}

# GENERAL
general {
    hide_cursor = true
}
# AUTH — native fingerprint support
auth {
    fingerprint {
        enabled = true
        ready_message = Scan fingerprint
        present_message = Scanning...
        retry_delay = 250
    }
}
# INPUT FIELD
input-field {
    monitor =
    size = 300, 50
    rounding = 0
    outline_thickness = 1
    dots_size = 0.2
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.4)
    inner_color = rgba(0, 0, 0, 0.55)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    placeholder_text = <span>󰢏  Password</span>
    hide_input = false
    check_color = rgba(150, 220, 150, 0.9)
    fail_color = rgba(220, 120, 120, 0.9)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgba(230, 180, 90, 0.9)
    position = 0, 60
    halign = center
    valign = bottom
}
# FINGERPRINT STATUS
label {
    monitor =
    text = $FPRINTPROMPT
    color = rgba(255, 255, 255, 0.6)
    font_size = 14
    font_family = scientifica
    position = 0, 125
    halign = center
    valign = bottom
}
# TIME HR
label {
    monitor =
    text = cmd[update:1000] date +"%H"
    color = rgba(255, 255, 255, 0.9)
    font_size = 96
    font_family = PP Neue Machina Ultra-Bold
    position = 0, 60
    halign = center
    valign = center
}
# TIME MIN
label {
    monitor =
    text = cmd[update:1000] date +"%M"
    color = rgba(1, 1, 1, 0.7)
    font_size = 96
    font_family = PP Neue Machina Ultra-Bold
    position = 0, -60
    halign = center
    valign = center
}
# USER
label {
    monitor =
    text = cmd[update:0] echo -n "$USER on " && grep 'PRETTY_NAME' /etc/os-release | cut -d '"' -f 2
    color = rgba(255, 255, 255, 0.85)
    font_size = 15
    font_family = scientifica
    position = 0, 10
    halign = center
    valign = bottom
}
# BATTERY
label {
    monitor =
    text = cmd[update:1000] ~/Scripts/battery.sh
    color = rgba(255, 255, 255, 0.85)
    font_size = 15
    font_family = scientifica
    position = -10, 10
    halign = right
    valign = bottom
    zindex = 2
}

animations {
  enabled = false
}
