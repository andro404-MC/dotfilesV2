[mgr]
ratio = [2, 3, 6]
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
linemode = "size"
show_symlink = false

[preview]
max_width = 1000
max_height = 1000
sixel_fraction = 14
image_delay = 0
image_filter = "Catmull-Rom"
cache_dir = "~/.cache/yazi/"
ueberzug_offset = [0.5, -0.5, -0.5, -0.5]

[plugin]
prepend_previewers = [
  { mime = "{audio}/*", run = "mediainfo" },
  { mime = "application/subrip", run = "mediainfo" },
]
prepend_preloaders = [
  { mime = "{audio}/*", run = "mediainfo" },
  { mime = "application/subrip", run = "mediainfo" },
]
prepend_fetchers = [
  { group = "git", url = "*", run = "git" },
  { group = "git", url = "*/", run = "git" },
]


[opener]
open = [{ run = 'xdg-open "$@"', orphan = true, desc = "Open", for = "unix" }]
